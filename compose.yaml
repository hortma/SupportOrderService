services:
  web:
    build:
      context: .
      dockerfile: SupportOrderService.Web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=supportorderservice;Username=supportorderservice;Password=${POSTGRES_PASSWORD:-supportorderservice}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: supportorderservice
      POSTGRES_USER: supportorderservice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportorderservice}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportorderservice -d supportorderservice"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
